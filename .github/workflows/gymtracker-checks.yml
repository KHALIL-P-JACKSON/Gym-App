name: GymTracker checks

on:
  pull_request:
  push:
    branches: [develop, master]

permissions:
  contents: read

concurrency:
  group: gymtracker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  persistence-tests:
    name: Persistence tests
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Run persistence tests
        run: swift test

  ios-build:
    name: iOS simulator build
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build iPhone app
        run: >-
          xcodebuild
          -project GymTracker.xcodeproj
          -scheme GymTracker
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
